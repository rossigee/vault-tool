name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Download Go dependencies
      run: go mod download

    - name: Run Go tests
      run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic

    - name: Run golangci-lint
      run: |
        VERSION=2.13.2
        BINDIR=$(go env GOPATH)/bin
        mkdir -p "$BINDIR"
        TARBALL="golangci-lint-${VERSION}-linux-amd64.tar.gz"
        BASE_URL="https://github.com/golangci/golangci-lint/releases/download/v${VERSION}"
        curl -fsSL "${BASE_URL}/${TARBALL}" -o "/tmp/${TARBALL}"
        curl -fsSL "${BASE_URL}/golangci-lint-${VERSION}-checksums.txt" -o /tmp/golangci-checksums.txt
        WANT=$(awk -v f="$TARBALL" '$2 == f { print $1; exit }' /tmp/golangci-checksums.txt)
        GOT=$(sha256sum "/tmp/${TARBALL}" | awk '{ print $1 }')
        test -n "$WANT" && test "$WANT" = "$GOT"
        tar -C /tmp -xzf "/tmp/${TARBALL}"
        install "/tmp/golangci-lint-${VERSION}-linux-amd64/golangci-lint" "$BINDIR/golangci-lint"
        golangci-lint run ./... --config .golangci.yml

    - name: Build binary
      run: go build -o vault-tool .

    - name: Security scan with Trivy
      run: |
        echo "Installing Trivy..."
        curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        export PATH=/usr/local/bin:$PATH

        if ! command -v trivy &> /dev/null; then
          echo "⚠️ Trivy installation failed, continuing without scan"
          echo "{}" > trivy-results.json
          exit 0
        fi

        echo "Scanning binary for vulnerabilities..."
        trivy fs --format json --output trivy-results.json vault-tool || echo "{}" > trivy-results.json

        echo "Scanning Go dependencies..."
        trivy fs --format json --output trivy-deps.json go.mod go.sum || echo "{}" > trivy-deps.json

        echo "✅ Security scan completed"

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ github.run_id }}
        path: |
          trivy-results.json
          trivy-deps.json
        retention-days: 30

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: vault-tool-${{ github.sha }}
        path: vault-tool
        retention-days: 7
