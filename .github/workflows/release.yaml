name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-debian-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y git

    - name: Download Go dependencies
      run: go mod download

    - name: Build binary
      run: |
        VERSION="${{ github.event.inputs.tag || github.ref_name }}"
        VERSION=${VERSION#v}
        echo "Building vault-tool v$VERSION"
        BINARY_NAME="vault-tool-Linux-x86_64"
        go build \
          -ldflags "-X github.com/rossigee/vault-tool/internal/version.Version=$VERSION -X github.com/rossigee/vault-tool/internal/version.Commit=${{ github.sha }} -X github.com/rossigee/vault-tool/internal/version.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          -o "$BINARY_NAME" .
        chmod +x "$BINARY_NAME"
        ./"$BINARY_NAME" version
        ls -lh "$BINARY_NAME"
        echo "✅ Binary built: $BINARY_NAME"

    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ || echo "")
        if [ -z "$PREV_TAG" ]; then
          echo "changelog=Initial release" >> $GITHUB_OUTPUT
        else
          CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD | grep -E "^- (feat|fix|perf|refactor|security|build):" || echo "- Various improvements")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=${{ github.ref_name }}
        echo "Creating release: $TAG"
        ls -lh vault-tool-Linux-x86_64
        gh release create "$TAG" \
          vault-tool-Linux-x86_64 \
          --title "vault-tool $TAG" \
          --notes "Binary release of vault-tool"
