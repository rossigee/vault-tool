name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload .deb packages to debs.golder.tech
      if: success()
      run: |
        # Extract version from git tag
        VERSION="${GITHUB_REF#refs/tags/v}"

        # Upload amd64 .deb
        echo "Uploading vault-tool_${VERSION}_linux_amd64.deb..."
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.DEB_REPO_UPLOAD_TOKEN }}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@dist/vault-tool_${VERSION}_linux_amd64.deb" \
          "https://debs.golder.tech/api/v1/upload?suite=stable&component=main" \
          --fail-with-body || exit 1

        # Upload arm64 .deb
        echo "Uploading vault-tool_${VERSION}_linux_arm64.deb..."
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.DEB_REPO_UPLOAD_TOKEN }}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@dist/vault-tool_${VERSION}_linux_arm64.deb" \
          "https://debs.golder.tech/api/v1/upload?suite=stable&component=main" \
          --fail-with-body || exit 1

        echo "✅ All .deb packages uploaded to debs.golder.tech"
