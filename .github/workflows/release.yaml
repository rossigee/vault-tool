name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-debian-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          debhelper \
          debhelper-compat \
          devscripts \
          git

    - name: Download Go dependencies
      run: go mod download

    - name: Configure git for dch
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Update debian/changelog
      run: |
        TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
        if [ -z "$TAG_NAME" ]; then
          echo "Error: No tag specified"
          exit 1
        fi
        VERSION=${TAG_NAME#v}
        echo "Building version: $VERSION"
        echo "$VERSION" > VERSION
        dch --newversion "$VERSION" --distribution unstable "Release $VERSION"

    - name: Build Debian package
      run: |
        cd /tmp
        cp -r $GITHUB_WORKSPACE vault-tool-build
        cd vault-tool-build
        dpkg-buildpackage -us -uc -b -d
        mkdir -p $GITHUB_WORKSPACE/debs
        cp /tmp/vault-tool_*.deb $GITHUB_WORKSPACE/debs/ || true
        cd $GITHUB_WORKSPACE
        ls -lh debs/ || echo "No debs found"

    - name: Test package installation
      run: |
        if [ -f debs/vault-tool_*.deb ]; then
          DEB_FILE=$(ls debs/vault-tool_*.deb | head -1)
          echo "Testing installation of $DEB_FILE"
          dpkg -i "$DEB_FILE" || \
            (apt-get update && apt-get install -f -y && dpkg -i "$DEB_FILE")
          vault-tool version
          vault-tool --help | head -5
          echo "✅ Package installation successful"
        else
          echo "⚠️ No .deb file found to test"
        fi

    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ || echo "")
        if [ -z "$PREV_TAG" ]; then
          echo "changelog=Initial release" >> $GITHUB_OUTPUT
        else
          CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD | grep -E "^- (feat|fix|perf|refactor|security|build):" || echo "- Various improvements")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        body: |
          ## vault-tool ${{ github.ref_name }}

          ### Changes
          ${{ steps.changelog.outputs.changelog }}

          ### Installation

          #### Direct Download
          Download the `.deb` package from this release and install it:

          ```bash
          RELEASE_TAG=${{ github.ref_name }}
          wget https://github.com/rossigee/vault-tool/releases/download/$RELEASE_TAG/vault-tool_*.deb
          sudo dpkg -i vault-tool_*.deb
          ```

          #### Build from Source
          ```bash
          git clone https://github.com/rossigee/vault-tool.git
          cd vault-tool
          git checkout ${{ github.ref_name }}
          make build
          sudo install -m 0755 vault-tool /usr/local/bin/
          ```

          Then use it:

          ```bash
          vault-tool unseal --help
          vault-tool emergency-root-token --help
          ```

        files: debs/vault-tool_*.deb
        draft: false
        prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
