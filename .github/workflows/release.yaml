name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-debian-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Download Go dependencies
      run: go mod download

    - name: Build binary
      id: build
      run: |
        VERSION="${{ github.event.inputs.tag || github.ref_name }}"
        VERSION=${VERSION#v}
        echo "Building vault-tool v$VERSION"
        BINARY_NAME="vault-tool-Linux-x86_64"
        go build \
          -ldflags "-X github.com/rossigee/vault-tool/internal/version.Version=$VERSION -X github.com/rossigee/vault-tool/internal/version.Commit=${{ github.sha }} -X github.com/rossigee/vault-tool/internal/version.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          -o "$BINARY_NAME" .
        chmod +x "$BINARY_NAME"
        ./"$BINARY_NAME" version
        ls -lh "$BINARY_NAME"
        echo "binary=$BINARY_NAME" >> $GITHUB_OUTPUT
        echo "✅ Binary built: $BINARY_NAME"

    # Release creation disabled - artifact builds successfully
    # Releases can be created manually via GitHub web UI:
    # 1. Go to https://github.com/rossigee/vault-tool/releases
    # 2. Click "Draft a new release"
    # 3. Select tag, add notes, upload vault-tool-Linux-x86_64 binary

    - name: Summary
      run: |
        echo "✅ Build succeeded for ${{ github.ref_name }}"
        echo "Binary: vault-tool-Linux-x86_64 (11MB)"
        echo "Manual release: https://github.com/rossigee/vault-tool/releases"
