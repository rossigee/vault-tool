name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload .deb packages to debs.golder.tech
      if: success()
      uses: rossigee/debian-repo-upload-action@v1
      with:
        files: dist/*.deb
        base-url: https://debs.golder.tech
        token: ${{ secrets.DEB_REPO_UPLOAD_TOKEN }}
        suite: stable
        component: main
        fail-on-error: true
