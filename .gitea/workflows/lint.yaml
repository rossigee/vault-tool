name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-lint:
    runs-on: self-hosted
    container:
      image: zot.bankrut.lan/infra/gitea-ci:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install CA certificates
      run: |
        if [ -w /etc/ssl/certs ]; then
          apt-get update
          apt-get install -y ca-certificates curl
          mkdir -p /usr/local/share/ca-certificates
          curl -fsSL https://cdn.bankrut.net/ca/certificates/bknst-root-ca.crt -o /usr/local/share/ca-certificates/bknst-root-ca.crt
          update-ca-certificates
        else
          echo "/etc/ssl/certs is read-only; relying on host trust store"
          apt-get update
          apt-get install -y ca-certificates curl
        fi

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.23'

    - name: Run golangci-lint
      run: |
        VERSION=2.13.2
        BINDIR=$(go env GOPATH)/bin
        mkdir -p "$BINDIR"
        TARBALL="golangci-lint-${VERSION}-linux-amd64.tar.gz"
        BASE_URL="https://github.com/golangci/golangci-lint/releases/download/v${VERSION}"
        curl -fsSL "${BASE_URL}/${TARBALL}" -o "/tmp/${TARBALL}"
        curl -fsSL "${BASE_URL}/golangci-lint-${VERSION}-checksums.txt" -o /tmp/golangci-checksums.txt
        WANT=$(awk -v f="$TARBALL" '$2 == f { print $1; exit }' /tmp/golangci-checksums.txt)
        GOT=$(sha256sum "/tmp/${TARBALL}" | awk '{ print $1 }')
        test -n "$WANT" && test "$WANT" = "$GOT"
        tar -C /tmp -xzf "/tmp/${TARBALL}"
        install "/tmp/golangci-lint-${VERSION}-linux-amd64/golangci-lint" "$BINDIR/golangci-lint"
        golangci-lint run ./... --config .golangci.yml
