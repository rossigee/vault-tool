name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-debian-package:
    runs-on: self-hosted
    container:
      image: zot.bankrut.lan/infra/gitea-ci:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install CA certificates
      run: |
        echo "Configuring CA certificates for Git SSL verification..."
        if [ -w /etc/ssl/certs ]; then
          apt-get update
          apt-get install -y ca-certificates curl git
          mkdir -p /usr/local/share/ca-certificates
          curl -fsSL https://cdn.bankrut.net/ca/certificates/bknst-root-ca.crt -o /usr/local/share/ca-certificates/bknst-root-ca.crt
          update-ca-certificates
        else
          echo "/etc/ssl/certs is read-only; relying on host trust store"
          apt-get update
          apt-get install -y ca-certificates curl git
        fi
        git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
        echo "CA certificates configured"

    - name: Verify Go version
      run: go version

    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          debhelper \
          debhelper-compat \
          ca-certificates \
          devscripts \
          git

    - name: Download Go dependencies
      run: go mod download

    - name: Update debian/changelog
      run: |
        # Handle both tag-triggered and manual dispatch
        TAG_NAME="${{ github.event.inputs.tag || gitea.ref_name }}"
        if [ -z "$TAG_NAME" ]; then
          echo "Error: No tag specified"
          exit 1
        fi
        VERSION=${TAG_NAME#v}
        echo "Building version: $VERSION"
        dch --newversion "$VERSION" --distribution unstable "Release $VERSION"

    - name: Build Debian package
      run: |
        # Build outside working directory (standard Debian build)
        dpkg-buildpackage -us -uc -b
        # Copy .deb to working directory for release upload
        cp ../*.deb . || true

    - name: List built packages
      run: ls -lh *.deb || echo "No debs found in current dir"

    - name: Test package installation
      run: |
        if [ -f vault-tool_*.deb ]; then
          dpkg -i vault-tool_*.deb || \
            (apt-get install -f -y && dpkg -i vault-tool_*.deb)
          vault-tool version
          vault-tool --help | head -5
        else
          echo "No .deb file found to test"
        fi

    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ || echo "")
        if [ -z "$PREV_TAG" ]; then
          echo "changelog=Initial release" >> $GITHUB_OUTPUT
        else
          CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD | grep -E "^- (feat|fix|perf|refactor|security|build):" || echo "- Various improvements")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Push Debian package to repository
      if: success()
      run: |
        if [ -z "${{ secrets.DEBIAN_REPO_TOKEN }}" ]; then
          echo "⚠️ DEBIAN_REPO_TOKEN secret not configured; skipping upload"
          echo "To enable: Set DEBIAN_REPO_TOKEN in repository secrets"
          exit 0
        fi

        if [ -f vault-tool_*.deb ]; then
          DEB_FILE=$(ls vault-tool_*.deb | head -1)
          DEB_SIZE=$(stat -c%s "$DEB_FILE" 2>/dev/null || stat -f%z "$DEB_FILE")
          echo "📦 Uploading $DEB_FILE ($(numfmt --to=iec $DEB_SIZE 2>/dev/null || echo $DEB_SIZE bytes)) to debs.golder.tech..."

          RESPONSE=$(curl -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.DEBIAN_REPO_TOKEN }}" \
            --data-binary "@$DEB_FILE" \
            "https://debs.golder.tech/api/v1/dists/stable/main/upload" \
            2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Successfully uploaded to Debian repository"
            echo "Response: $BODY"
          else
            echo "❌ Upload failed with HTTP $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi
        else
          echo "⚠️ No .deb file found, skipping upload to repository"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        body: |
          ## vault-tool ${{ gitea.ref_name }}

          ### Changes
          ${{ steps.changelog.outputs.changelog }}

          ### Installation

          Add the Golder package repository:

          ```bash
          curl https://debs.golder.tech/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/golder-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/golder-archive-keyring.gpg] https://debs.golder.tech stable main" | sudo tee /etc/apt/sources.list.d/golder.sources.list
          sudo apt update
          sudo apt install vault-tool
          ```

          Or install the `.deb` package directly from this release:

          ```bash
          wget https://git.golder.lan/rossgolderltd/vault-tool/releases/download/${{ gitea.ref_name }}/vault-tool_*.deb
          sudo dpkg -i vault-tool_*.deb
          ```

          Then use it:

          ```bash
          vault-tool unseal --help
          vault-tool emergency-root-token --help
          ```

        files: vault-tool_*.deb
        draft: false
        prerelease: ${{ contains(gitea.ref_name, '-rc') || contains(gitea.ref_name, '-beta') || contains(gitea.ref_name, '-alpha') }}
